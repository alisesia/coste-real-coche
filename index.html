<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora del Coste Real de tu Coche</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora del Coste Real de tu Coche</h1>
        <p class="subtitle">Descubre cuánto te cuesta realmente moverte al mes, al año y por kilómetro.</p>

        <form id="car-form">
            <div class="form-group">
                <label for="price">Precio de compra del coche (€):</label>
                <input type="number" id="price" placeholder="Ej: 18000" required>
            </div>

            <div class="form-group">
                <label for="km">Kilómetros al año:</label>
                <input type="number" id="km" placeholder="Ej: 15000" required>
            </div>

            <div class="form-group">
                <label for="consumption">Consumo (L/100 km):</label>
                <input type="number" step="0.1" id="consumption" placeholder="Ej: 6.0" required>
            </div>

            <div class="form-group">
                <label for="fuelPrice">Precio del combustible (€/L):</label>
                <input type="number" step="0.01" id="fuelPrice" placeholder="Ej: 1.50" required>
            </div>

            <div class="form-group">
                <label for="insurance">Seguro anual (€):</label>
                <input type="number" id="insurance" placeholder="Ej: 650" required>
            </div>

            <div class="form-group">
                <label for="maintenance">Mantenimiento y revisiones anuales (€):</label>
                <input type="number" id="maintenance" placeholder="Ej: 500" required>
            </div>

            <div class="form-group">
                <label for="other">Otros gastos anuales (ITV, parking, impuestos) (€):</label>
                <input type="number" id="other" placeholder="Ej: 300" required>
            </div>

            <button type="button" onclick="calculate()">Calcular Coste Real</button>
        </form>

        <div id="results" class="results-card hidden">
            <h2>Resultados del Análisis</h2>
            <div class="result-item">
                <span>Gasto anual en combustible:</span>
                <strong id="fuelCostYear">0 €</strong>
            </div>
            <div class="result-item">
                <span>Coste Total Mensual:</span>
                <strong id="monthlyCost" class="highlight">0 €</strong>
            </div>
            <div class="result-item">
                <span>Coste Total Anual:</span>
                <strong id="annualCost">0 €</strong>
            </div>
            <div class="result-item">
                <span>Coste por Kilómetro:</span>
                <strong id="costPerKm">0 €/km</strong>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
