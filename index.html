<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Coste Real del Coche</title>

    <meta
        name="description"
        content="Calcula el coste real de tu coche incluyendo combustible, gastos fijos y depreciación. Compara dos vehículos y descubre cuál te cuesta menos."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HERO -->
    <header class="hero">
        <div class="hero-badge">CALCULADORA FINANCIERA</div>

        <h1>¿Cuánto te cuesta realmente tu coche?</h1>

        <p>
            Descubre el coste real de tener un coche teniendo en cuenta
            combustible, gastos fijos y pérdida de valor.
        </p>
    </header>


    <!-- =========================
         CALCULADORA
    ========================== -->

    <main class="main-grid">

        <!-- FORMULARIO -->
        <section class="card input-card">

            <div class="card-header">
                <div>
                    <span class="section-number">01</span>
                    <h2>Datos del vehículo</h2>
                </div>

                <span class="required">Todos los campos</span>
            </div>


            <!-- PRECIO -->
            <div class="form-group">
                <label for="purchasePrice">
                    Precio de compra
                    <span>€</span>
                </label>

                <div class="input-wrapper">
                    <input
                        type="number"
                        id="purchasePrice"
                        placeholder="25.000"
                        min="0"
                        step="0.01"
                    >
                    <span>€</span>
                </div>
            </div>


            <!-- VALOR FINAL -->
            <div class="form-group">
                <label for="residualValue">
                    Valor estimado al final
                    <span>€</span>
                </label>

                <div class="input-wrapper">
                    <input
                        type="number"
                        id="residualValue"
                        placeholder="15.000"
                        min="0"
                        step="0.01"
                    >
                    <span>€</span>
                </div>
            </div>


            <!-- PERIODO + KM -->
            <div class="form-row">

                <div class="form-group">
                    <label for="years">
                        Periodo de propiedad
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="years"
                            placeholder="5"
                            min="1"
                            step="1"
                        >
                        <span>años</span>
                    </div>
                </div>


                <div class="form-group">
                    <label for="kmYear">
                        Kilómetros al año
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="kmYear"
                            placeholder="15.000"
                            min="1"
                            step="1"
                        >
                        <span>km</span>
                    </div>
                </div>

            </div>


            <!-- COMBUSTIBLE -->
            <div class="form-section-title">
                <span>Combustible</span>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="consumption">
                        Consumo
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="consumption"
                            placeholder="6,5"
                            min="0"
                            step="0.1"
                        >
                        <span>L/100 km</span>
                    </div>
                </div>


                <div class="form-group">
                    <label for="fuelPrice">
                        Precio combustible
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="fuelPrice"
                            placeholder="1,60"
                            min="0"
                            step="0.01"
                        >
                        <span>€/L</span>
                    </div>
                </div>

            </div>


            <!-- GASTOS FIJOS -->
            <div class="form-section-title">
                <span>Gastos fijos anuales</span>
            </div>

            <div class="form-group">
                <label for="fixedCosts">
                    Seguro, mantenimiento, ITV, impuestos, parking...
                </label>

                <div class="input-wrapper">
                    <input
                        type="number"
                        id="fixedCosts"
                        placeholder="1.000"
                        min="0"
