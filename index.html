<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Coste Real de tu Coche</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="header">

      <div class="badge">
        CALCULADORA GRATUITA
      </div>

      <h1>
        ¿Cuánto te cuesta realmente tu coche?
      </h1>

      <p class="subtitle">
        Calcula cuánto gastas realmente en tu coche
        teniendo en cuenta gastos y pérdida de valor.
      </p>

    </header>


    <!-- DATOS DEL COCHE -->

    <form id="calc-form">

      <div class="form-card">

        <h2>Precio y uso del coche</h2>

        <div class="form-grid">

          <div class="form-group">

            <label for="precioCompra">
              Precio de compra (€)
            </label>

            <input
              type="number"
              id="precioCompra"
              placeholder="18000"
              min="0"
              step="any"
              required
            >

          </div>


          <div class="form-group">

            <label for="valorFinal">
              Valor estimado final (€)
            </label>

            <input
              type="number"
              id="valorFinal"
              placeholder="8000"
              min="0"
              step="any"
              required
            >

          </div>


          <div class="form-group">

            <label for="periodoAnos">
              Años de propiedad
            </label>

            <input
              type="number"
              id="periodoAnos"
              placeholder="5"
              min="1"
              step="any"
              required
            >

          </div>


          <div class="form-group">

            <label for="kmAno">
              Kilómetros al año
            </label>

            <input
              type="number"
              id="kmAno"
              placeholder="15000"
              min="1"
              step="any"
              required
            >

          </div>

        </div>

      </div>


      <!-- GASTOS -->

      <div class="form-card">

        <h2>Gastos del coche</h2>

        <div class="form-grid">

          <div class="form-group">

            <label for="consumo">
              Consumo (L/100 km)
            </label>

            <input
              type="number"
              id="consumo"
              placeholder="6"
              min="0"
              step="any"
              required
            >

          </div>


          <div class="form-group">

            <label for="precioCombustible">
              Precio combustible (€/L)
            </label>

            <input
              type="number"
              id="precioCombustible"
              placeholder="1.50"
              min="0"
              step="any"
              required
            >

          </div>


          <div class="form-group">

            <label for="seguro">
              Seguro anual (€)
            </label>

            <input
              type="number"
              id="seguro"
              placeholder="650"
              min="
